<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="An agent consulting holdings, macro and regime tools before proposing a change">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#0a0a0a"/>
    </linearGradient>
    <pattern id="dots" width="25" height="25" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#3f3f46" opacity="0.45"/>
    </pattern>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>
  <rect width="800" height="450" fill="url(#dots)"/>
  <line x1="400.0" y1="225.0" x2="230.0" y2="120.0" stroke="#60a5fa" stroke-width="1.3" opacity="0.45" stroke-linecap="round" stroke-dasharray="5 6"/>
  <circle cx="230.0" cy="120.0" r="6.0" fill="#38bdf8" opacity="0.95"/>
  <text x="230" y="102" fill="#38bdf8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" letter-spacing="2.5" text-anchor="middle">HOLDINGS</text>
  <line x1="400.0" y1="225.0" x2="230.0" y2="330.0" stroke="#60a5fa" stroke-width="1.3" opacity="0.45" stroke-linecap="round" stroke-dasharray="5 6"/>
  <circle cx="230.0" cy="330.0" r="6.0" fill="#38bdf8" opacity="0.95"/>
  <text x="230" y="358" fill="#38bdf8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" letter-spacing="2.5" text-anchor="middle">MACRO</text>
  <line x1="400.0" y1="225.0" x2="400.0" y2="70.0" stroke="#60a5fa" stroke-width="1.3" opacity="0.45" stroke-linecap="round" stroke-dasharray="5 6"/>
  <circle cx="400.0" cy="70.0" r="6.0" fill="#38bdf8" opacity="0.95"/>
  <text x="400" y="52" fill="#38bdf8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" letter-spacing="2.5" text-anchor="middle">REGIME</text>
  <circle cx="400" cy="225" r="46" fill="none" stroke="#a78bfa" stroke-width="1.4" stroke-dasharray="210 80" opacity="0.6" transform="rotate(-40 400 225)"/>
  <circle cx="400.0" cy="225.0" r="14.0" fill="#a78bfa" opacity="0.7" filter="url(#glow)"/>
  <circle cx="400.0" cy="225.0" r="13.0" fill="#a78bfa" opacity="1"/>
  <text x="400" y="300" fill="#a78bfa" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" letter-spacing="2.5" text-anchor="middle">AGENT</text>
  <line x1="460.0" y1="225.0" x2="590.0" y2="225.0" stroke="#52525b" stroke-width="2" opacity="1.0" stroke-linecap="round"/>
  <path d="M590 218 L604 225 L590 232 Z" fill="#52525b"/>
  <circle cx="630.0" cy="225.0" r="10.0" fill="#2dd4bf" opacity="0.7" filter="url(#glow)"/>
  <circle cx="630.0" cy="225.0" r="9.0" fill="#2dd4bf" opacity="1"/>
  <text x="630" y="259" fill="#2dd4bf" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" letter-spacing="2.5" text-anchor="middle">PROPOSAL</text>
</svg>
