<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="Five pipeline stages: human, model, code, model, code">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#0a0a0a"/>
    </linearGradient>
    <pattern id="dots" width="25" height="25" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#3f3f46" opacity="0.45"/>
    </pattern>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
  </defs>

  <rect width="800" height="450" fill="url(#bg)"/>
  <rect width="800" height="450" fill="url(#dots)"/>

  <g transform="translate(400 225) scale(1.3) translate(-400 -225)">
  <!-- search fan-out from the two model stages -->
  <g stroke="#60a5fa" stroke-width="1.2" opacity="0.35" fill="none">
    <path d="M260 225 L215 120 M260 225 L260 105 M260 225 L305 120"/>
    <path d="M540 225 L495 330 M540 225 L540 345 M540 225 L585 330"/>
  </g>
  <g fill="#60a5fa" opacity="0.55">
    <circle cx="215" cy="120" r="4"/><circle cx="260" cy="105" r="4"/><circle cx="305" cy="120" r="4"/>
    <circle cx="495" cy="330" r="4"/><circle cx="540" cy="345" r="4"/><circle cx="585" cy="330" r="4"/>
  </g>

  <!-- pipeline spine -->
  <line x1="120" y1="225" x2="680" y2="225" stroke="#52525b" stroke-width="2"/>

  <g filter="url(#glow)" opacity="0.7">
    <circle cx="120" cy="225" r="14" fill="#fbbf24"/>
    <circle cx="260" cy="225" r="14" fill="#60a5fa"/>
    <circle cx="540" cy="225" r="14" fill="#60a5fa"/>
  </g>

  <circle cx="120" cy="225" r="13" fill="#fbbf24"/>
  <circle cx="260" cy="225" r="13" fill="#60a5fa"/>
  <circle cx="400" cy="225" r="13" fill="#a1a1aa"/>
  <circle cx="540" cy="225" r="13" fill="#60a5fa"/>
  <circle cx="680" cy="225" r="13" fill="#a1a1aa"/>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" letter-spacing="2.5" text-anchor="middle">
    <text x="120" y="268" fill="#fbbf24">HUMAN</text>
    <text x="260" y="268" fill="#60a5fa">MODEL</text>
    <text x="400" y="268" fill="#a1a1aa">CODE</text>
    <text x="540" y="198" fill="#60a5fa">MODEL</text>
    <text x="680" y="268" fill="#a1a1aa">CODE</text>
  </g>
  </g>
</svg>
